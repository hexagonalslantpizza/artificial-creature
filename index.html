<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Artificial Creature Experiment — Alpha</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="app">

        <!-- HEADER -->

        <header class="topbar">

            <div class="title-area">

                <h1>ARTIFICIAL CREATURE EXPERIMENT</h1>

                <div class="subtitle">

                    ALPHA • ARTIFICIAL NEURAL LIFE SIMULATION

                </div>

            </div>

            <div class="status-area">

                <span id="statusIndicator" class="status-dot"></span>

                <span id="statusText">PAUSED</span>

            </div>

        </header>

        <!-- MAIN CONTROLS -->

        <section class="toolbar">

            <div class="control-group primary-controls">

                <button id="startButton" class="primary">

                    START

                </button>

                <button id="resetButton">

                    RESET CREATURE

                </button>

            </div>

            <div class="control-group world-controls">

                <span class="control-label">

                    WORLD

                </span>

                <button id="foodButton">

                    + FOOD

                </button>

                <button id="waterButton">

                    + WATER

                </button>

                <button id="dangerButton" class="danger-button">

                    + DANGER

                </button>

            </div>

            <div class="control-group clear-controls">

                <span class="control-label">

                    CLEAR

                </span>

                <button id="clearFoodButton">

                    FOOD

                </button>

                <button id="clearWaterButton">

                    WATER

                </button>

                <button id="clearDangerButton">

                    DANGER

                </button>

                <button id="clearMapButton">

                    MAP

                </button>

            </div>

        </section>

        <!-- ADVANCED CONTROLS -->

        <section class="advanced-toolbar">

            <div class="advanced-title">

                EXPERIMENT CONTROLS

            </div>

            <div class="advanced-buttons">

                <button id="resetCreatureButton">

                    RESET CREATURE

                </button>

                <button id="resetBrainButton" class="warning-button">

                    RESET BRAIN

                </button>

                <button id="fullResetButton" class="danger-button">

                    FULL RESET

                </button>

            </div>

            <div class="keyboard-hints">

                <span><kbd>F</kbd> Food</span>

                <span><kbd>W</kbd> Water</span>

                <span><kbd>D</kbd> Danger</span>

                <span><kbd>C</kbd> Clear Map</span>

                <span><kbd>SPACE</kbd> Pause / Start</span>

            </div>

        </section>

        <!-- SIMULATION -->

        <main class="simulation-container">

            <canvas

                id="simulationCanvas"

                width="1200"

                height="750">

            </canvas>

        </main>

        <!-- FOOTER -->

        <footer class="footer">

            <div class="footer-item">

                <strong>82</strong>

                <span>BASE NEURONS</span>

            </div>

            <div class="footer-divider"></div>

            <div class="footer-item">

                <strong>72</strong>

                <span>INTERNAL NEURONS</span>

            </div>

            <div class="footer-divider"></div>

            <div class="footer-item">

                <strong>RL</strong>

                <span>REINFORCEMENT LEARNING</span>

            </div>

            <div class="footer-divider"></div>

            <div class="footer-item">

                <strong>MEMORY</strong>

                <span>EPISODIC LEARNING</span>

            </div>

            <div class="footer-divider"></div>

            <div class="footer-item">

                <strong>GROWING</strong>

                <span>ADAPTIVE BRAIN</span>

            </div>

        </footer>

    </div>

    <!-- SIMULATION CODE -->

    <script type="module" src="main.js"></script>

</body>

</html>
